name: Publish @worldmonitor/core-types
# This workflow publishes the @worldmonitor/core-types package to GitHub Packages.
# It triggers on pushes to the 'packages/core-types' branch, which follows the
# poly-repo extraction strategy: each extracted package lives on a dedicated
# 'packages/<name>' branch until it graduates to its own repository.
on:
  push:
    branches: [packages/core-types]
    paths: ['packages/core-types/**']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/core-types
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
      - run: npm ci
      - run: npm run build
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
